{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
<p>Cadastre-se para reservar assentos.</p>
{% if erro %}<p class="alerta" role="alert">{{ erro }}</p>{% endif %}
<form method="post" action="/cadastro" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required autocomplete="name">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <label for="idade">Idade</label>
  <input id="idade" name="idade" type="number" min="1" max="120" required>
  <label for="senha">Senha (mínimo de 12 caracteres)</label>
  <input id="senha" name="senha" type="password" minlength="12" required autocomplete="new-password">
  <fieldset>
    <legend>Endereço</legend>
    <label for="logradouro">Logradouro</label><input id="logradouro" name="logradouro" required autocomplete="address-line1">
    <label for="numero">Número</label><input id="numero" name="numero" required>
    <label for="complemento">Complemento (opcional)</label><input id="complemento" name="complemento">
    <label for="bairro">Bairro</label><input id="bairro" name="bairro" required>
    <label for="cidade">Cidade</label><input id="cidade" name="cidade" required autocomplete="address-level2">
    <label for="estado">Estado (UF)</label><input id="estado" name="estado" maxlength="2" pattern="[A-Z]{2}" required>
    <label for="cep">CEP</label><input id="cep" name="cep" pattern="\d{5}-?\d{3}" required autocomplete="postal-code">
  </fieldset>
  <button type="submit">Criar conta</button>
</form>
{% endblock %}
