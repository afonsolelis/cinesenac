{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
{% if erro %}<p class="alerta" role="alert">{{ erro }}</p>{% endif %}
<form method="post" action="/entrar" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" required autocomplete="current-password">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
